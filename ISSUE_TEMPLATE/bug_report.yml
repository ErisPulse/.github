name: Bug 报告
description: 报告一个 Bug 以帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您花时间报告这个 Bug！请填写以下信息帮助我们定位问题。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 请清晰简洁地描述这个 Bug
      placeholder: "当我尝试..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供复现该问题的步骤
      placeholder: |
        1. 运行 '...'
        2. 当适配器收到 '...'
        3. 看到错误 '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 请描述您期望发生什么
      placeholder: "我期望..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 请描述实际发生了什么
      placeholder: "实际上..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志输出
      description: 如果有相关的日志输出，请粘贴在这里
      render: shell

  - type: input
    id: version
    attributes:
      label: ErisPulse 版本
      description: 您使用的 ErisPulse 版本
      placeholder: "2.3.x"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python 版本
      description: 您使用的 Python 版本
      placeholder: "3.10.x"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 您的操作系统
      placeholder: "Windows 11 / Debian 13 / macOS 13"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他可能有帮助的信息
